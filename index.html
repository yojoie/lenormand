<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雷诺曼占卜</title>
  <!-- Resource hints for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Preload card images in parallel with JS chunks -->
  <link rel="preload" as="image" href="/images/fortune-hand-1.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/fortune-hand-2.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/fortune-hand-3.webp" fetchpriority="high" />
  <script type="module">
    if (import.meta.hot?.on) {
      import.meta.hot.on('vite:error', (error) => {
        if (error.err) {
          console.error(
            [error.err.message, error.err.frame].filter(Boolean).join('\n'),
          )
        }
      })
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
